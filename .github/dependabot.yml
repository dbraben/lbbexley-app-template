version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      accessibility-testing:
        patterns:
          - '@playwright/*'
          - '@axe-core/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The check on GitHub is pinned to the same release as the synced Bexley
      # files and .claude/settings.json: npm run standards:update moves them together.
      - dependency-name: dbraben/lbbexley-digital-standards
