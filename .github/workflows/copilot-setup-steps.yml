# Prepares the environment GitHub Copilot's cloud agent works in, so it can run
# the same checks as everyone else: npm run check, npm run test:a11y, and the
# Bexley hooks in .github/hooks/lbbexley.json.
name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium
