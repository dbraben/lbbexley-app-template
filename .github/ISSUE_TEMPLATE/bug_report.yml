name: Bug
description: Something in this service doesn't work as it should
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Don't include personal data, screenshots of real records or real reference numbers.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Dev, test or production, and the browser or device.
